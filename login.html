<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>로그인 - Duolingo</title>
    <meta name="description" content="듀오링고 계정으로 로그인하거나 새 계정을 만드세요.">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
    <link rel="stylesheet" href="./assets/css/main.css">
    <script type="module" src="./assets/js/layout/site-layout.js"></script>
    <script type="module" src="./assets/js/login-page.js"></script>
  </head>
  <body class="notice-page auth-page">
    <a class="skip-link" href="#main">본문 바로가기</a>

    <!-- 공통 헤더: assets/js/layout (layout-data.js 에서 관리) -->
    <div data-site-header></div>

    <main id="main">
      <!-- Hero Banner -->
      <section class="notice-hero" aria-labelledby="authHeroTitle">
        <div class="notice-hero__clouds" aria-hidden="true">
          <div class="notice-hero__cloud notice-hero__cloud--1"></div>
          <div class="notice-hero__cloud notice-hero__cloud--2"></div>
        </div>
        <div class="notice-hero__content">
          <div class="notice-hero__title-wrap">
            <div class="notice-hero__sparkle notice-hero__sparkle--left" aria-hidden="true">
              <span></span><span></span><span></span>
            </div>
            <h1 class="notice-hero__title" id="authHeroTitle">LOGIN</h1>
            <div class="notice-hero__sparkle notice-hero__sparkle--right" aria-hidden="true">
              <span></span><span></span><span></span>
            </div>
          </div>
          <p class="notice-hero__subtitle">듀오링고 계정으로 로그인하세요.</p>
        </div>
      </section>

      <section class="notice-main auth-main" aria-label="로그인 및 회원가입">
        <!-- 로그인 카드 -->
        <div class="notice-card-wrapper auth-card-wrapper">
          <img
            src="./assets/images/notice/duo-peeking.svg"
            alt=""
            class="notice-mascot-owl auth-mascot-owl"
            aria-hidden="true"
          >
          <div class="notice-card auth-card">
            <!-- 이미 로그인된 상태 -->
            <div class="auth-logged-in" id="authLoggedIn" hidden>
              <p class="auth-logged-in__title"><strong id="authLoggedInName"></strong>님, 이미 로그인되어 있어요.</p>
              <div class="auth-logged-in__actions">
                <a class="btn btn--sm" id="btnAuthContinue" href="./notice.html">이전 화면으로</a>
                <button type="button" class="btn btn--outline btn--sm" id="btnAuthLogout">로그아웃</button>
              </div>
            </div>

            <form class="auth-form" id="loginForm" novalidate>
              <h2 class="notice-form-header__title auth-form__title">로그인</h2>

              <div class="auth-field">
                <label class="notice-form-label auth-field__label" for="loginUserId">아이디</label>
                <input class="notice-form-input" id="loginUserId" name="userId" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="20" required>
              </div>

              <div class="auth-field">
                <label class="notice-form-label auth-field__label" for="loginPassword">비밀번호</label>
                <input class="notice-form-input" id="loginPassword" name="password" type="password" autocomplete="current-password" maxlength="64" required>
              </div>

              <p class="auth-form__error" id="loginError" role="alert" hidden></p>

              <button type="submit" class="btn auth-form__submit" id="btnLoginSubmit">로그인</button>
            </form>
          </div>
        </div>

        <!-- 회원가입 (페이지 하단) -->
        <div class="auth-signup-divider" aria-hidden="true">
          <span>아직 계정이 없으신가요?</span>
        </div>

        <div class="notice-card auth-card auth-signup-card" id="signup">
          <form class="auth-form" id="signupForm" novalidate>
            <div class="notice-form-header auth-form__header">
              <h2 class="notice-form-header__title auth-form__title">회원가입</h2>
              <span class="notice-form-header__meta"><span class="required">*</span> 모든 항목은 필수입니다.</span>
            </div>

            <div class="auth-field">
              <label class="notice-form-label auth-field__label" for="signupName">이름 <span class="required">*</span></label>
              <input class="notice-form-input" id="signupName" name="name" type="text" autocomplete="name" maxlength="20" required>
              <p class="auth-field__msg" data-msg-for="name"></p>
            </div>

            <div class="auth-field">
              <label class="notice-form-label auth-field__label" for="signupUserId">아이디 <span class="required">*</span></label>
              <div class="auth-field__row">
                <input class="notice-form-input" id="signupUserId" name="userId" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="20" required aria-describedby="signupUserIdHint">
                <button type="button" class="btn btn--outline btn--sm auth-check-btn" data-check="userId">중복확인</button>
              </div>
              <p class="auth-field__hint" id="signupUserIdHint">영문 소문자로 시작하는 4~20자 (영문 소문자, 숫자, _)</p>
              <p class="auth-field__msg" data-msg-for="userId"></p>
            </div>

            <div class="auth-field">
              <label class="notice-form-label auth-field__label" for="signupPassword">비밀번호 <span class="required">*</span></label>
              <input class="notice-form-input" id="signupPassword" name="password" type="password" autocomplete="new-password" maxlength="20" required aria-describedby="signupPasswordHint">
              <p class="auth-field__hint" id="signupPasswordHint">8~20자, 영문과 숫자를 모두 포함</p>
              <p class="auth-field__msg" data-msg-for="password"></p>
            </div>

            <div class="auth-field">
              <label class="notice-form-label auth-field__label" for="signupPasswordConfirm">비밀번호 확인 <span class="required">*</span></label>
              <input class="notice-form-input" id="signupPasswordConfirm" name="passwordConfirm" type="password" autocomplete="new-password" maxlength="20" required>
              <p class="auth-field__msg" data-msg-for="passwordConfirm"></p>
            </div>

            <div class="auth-field">
              <label class="notice-form-label auth-field__label" for="signupEmail">이메일 <span class="required">*</span></label>
              <div class="auth-field__row">
                <input class="notice-form-input" id="signupEmail" name="email" type="email" autocomplete="email" autocapitalize="none" spellcheck="false" maxlength="100" required>
                <button type="button" class="btn btn--outline btn--sm auth-check-btn" data-check="email">중복확인</button>
              </div>
              <p class="auth-field__msg" data-msg-for="email"></p>
            </div>

            <p class="auth-form__error" id="signupError" role="alert" hidden></p>

            <button type="submit" class="btn auth-form__submit" id="btnSignupSubmit">회원가입</button>
          </form>
        </div>
      </section>
    </main>

    <!-- 공통 푸터: assets/js/layout (layout-data.js 에서 관리) -->
    <div data-site-footer></div>
  </body>
</html>
