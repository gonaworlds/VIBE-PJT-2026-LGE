<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Duolingo - 즐겁게 배우는 외국어와 체스</title>
    <meta
      name="description"
      content="Duolingo와 함께 영어, 스페인어 등 다양한 외국어와 체스를 재미있게 배워 보세요. 짧고 즐거운 학습을 통해 새로운 표현과 전략을 익히고, 오늘부터 꾸준히 성장하는 경험을 시작할 수 있어요. 나에게 맞는 학습을 찾고 매일 조금씩 배움의 즐거움을 이어 가 보세요."
    >
    <link rel="stylesheet" href="./assets/css/main.css">
    <script type="module" src="./assets/js/main.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">본문 바로가기</a>

    <header class="site-header">
      <div class="inner-box">
        <div class="part part--between">
          <span class="site-header__brand">로고 자리표시</span>
          <details class="site-language">
            <summary class="site-language__summary">
              사이트 언어: 한국어
              <span class="site-language__chevron" aria-hidden="true"></span>
            </summary>
            <p class="site-language__panel">현재 사이트 언어는 한국어예요.</p>
          </details>
        </div>
      </div>
    </header>

    <main class="landing-main" id="main">
      <section class="section landing-section" aria-labelledby="landing-title">
        <div class="inner-box">
          <div class="part landing-hero">
            <figure class="landing-hero__art">
              <figcaption>일러스트 자리표시 영역</figcaption>
            </figure>
            <div class="landing-hero__content">
              <h1 class="landing-hero__title" id="landing-title">
                외국어, 체스 등을 가장 재미있게 배우는 방법!
              </h1>
              <div class="landing-hero__actions">
                <a class="btn" href="https://www.duolingo.com/register">시작하기</a>
                <a class="btn btn--outline" href="https://www.duolingo.com/log-in">
                  계정이 이미 있습니다
                </a>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="inner-box">
        <div class="part part--center">
          <div class="language-strip">
            <button
              class="language-strip__control"
              type="button"
              aria-label="이전 학습 언어"
              data-js-language-prev
            >
              <span aria-hidden="true">‹</span>
            </button>
            <div
              class="language-strip__viewport"
              role="group"
              aria-label="사용 가능한 학습 언어"
              data-js-language-viewport
            >
              <ul class="language-strip__list" data-js-language-list>
                <li class="language-strip__item"><span class="language-strip__flag" aria-hidden="true">🇺🇸</span>영어</li>
                <li class="language-strip__item"><span class="language-strip__flag" aria-hidden="true">♟</span>체스</li>
                <li class="language-strip__item"><span class="language-strip__flag" aria-hidden="true">🇪🇸</span>스페인어</li>
                <li class="language-strip__item"><span class="language-strip__flag" aria-hidden="true">🇫🇷</span>프랑스어</li>
                <li class="language-strip__item"><span class="language-strip__flag" aria-hidden="true">🇩🇪</span>독일어</li>
                <li class="language-strip__item"><span class="language-strip__flag" aria-hidden="true">🇮🇹</span>이탈리아어</li>
                <li class="language-strip__item"><span class="language-strip__flag" aria-hidden="true">🇧🇷</span>포르투갈어</li>
                <li class="language-strip__item"><span class="language-strip__flag" aria-hidden="true">🇯🇵</span>일본어</li>
                <li class="language-strip__item"><span class="language-strip__flag" aria-hidden="true">🇨🇳</span>중국어</li>
              </ul>
            </div>
            <button
              class="language-strip__control"
              type="button"
              aria-label="다음 학습 언어"
              data-js-language-next
            >
              <span aria-hidden="true">›</span>
            </button>
          </div>
        </div>
      </div>
    </footer>
  </body>
</html>
