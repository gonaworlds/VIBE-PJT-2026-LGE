<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>1:1 문의하기 - Duolingo</title>
    <meta
      name="description"
      content="듀오링고 이용 중 궁금한 점이나 불편한 사항을 문의하시면 친절하고 신속하게 답변해 드립니다."
    >
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Brand Fonts Preload (.woff2) -->
    <link rel="preload" href="./assets/fonts/DuolingoSansVF.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="./assets/fonts/Feather Bold-700-ui.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
    <link rel="stylesheet" href="./assets/css/main.css">
    <link rel="stylesheet" href="./assets/css/pages/inquiry.css">
    <script type="module" src="./assets/js/layout/site-layout.js"></script>
    <script type="module" src="./assets/js/inquiry-page.js"></script>
  </head>
  <body class="notice-page inquiry-page">
    <a class="skip-link" href="#main">본문 바로가기</a>

    <!-- 공통 헤더: assets/js/layout (layout-data.js 에서 관리) -->
    <div data-site-header></div>

    <!-- Main Content -->
    <main id="main">
      <!-- Hero Banner -->
      <section class="notice-hero" aria-labelledby="inquiryHeroTitle">
        <div class="notice-hero__clouds" aria-hidden="true">
          <div class="notice-hero__cloud notice-hero__cloud--1"></div>
          <div class="notice-hero__cloud notice-hero__cloud--2"></div>
        </div>
        <div class="notice-hero__content">
          <div class="notice-hero__title-wrap">
            <div class="notice-hero__sparkle notice-hero__sparkle--left" aria-hidden="true">
              <span></span><span></span><span></span>
            </div>
            <h1 class="notice-hero__title" id="inquiryHeroTitle">INQUIRY</h1>
            <div class="notice-hero__sparkle notice-hero__sparkle--right" aria-hidden="true">
              <span></span><span></span><span></span>
            </div>
          </div>
          <p class="notice-hero__subtitle" id="inquiryHeroSubtitle">
            궁금한 점을 문의하시면 친절하고 신속하게 답변해 드립니다.
          </p>
        </div>
      </section>

      <!-- Board Section -->
      <section class="notice-main" aria-label="1:1 문의하기 게시판 본문">
        <!-- 게시판 탭 내비게이션 -->
        <nav class="board-tab-nav" aria-label="게시판 선택">
          <a href="./notice.html" class="board-tab-nav__item">공지사항</a>
          <a href="./inquiry.html" class="board-tab-nav__item is-active" aria-current="page">1:1 문의하기</a>
        </nav>

        <div class="notice-card-wrapper">
          <!-- 부엉이 및 캘린더 장식 -->
          <img
            src="./assets/images/notice/duo-peeking.svg"
            alt="부엉이 듀오"
            class="notice-mascot-owl"
            aria-hidden="true"
          >
          <img
            src="./assets/images/notice/calendar-3d.png"
            alt="캘린더 아이콘"
            class="notice-mascot-calendar"
            aria-hidden="true"
          >

          <!-- SPA 컨테이너 (목록, 상세, 글쓰기, 글수정 전환) -->
          <div class="notice-card" id="inquiryAppContainer">
            <div class="notice-loading">
              <div class="notice-spinner"></div>
              <p>문의글을 불러오는 중입니다...</p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- 공통 푸터: assets/js/layout (layout-data.js 에서 관리) -->
    <div data-site-footer></div>
  </body>
</html>
